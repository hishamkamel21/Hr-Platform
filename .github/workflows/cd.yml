name: HR-PLATFORM-CD-PIPELINE

on:
  push:
    branches:
      - main

jobs:
  Build_And_Push:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hr-platform:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hr-platform:latest

  Deploy:

    needs: Build_And_Push

    runs-on: ubuntu-latest

    steps:

      - name: Clone infra repo
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/hishamkamel21/Hr-Platform-Infra.git infra

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Helm values
        working-directory: infra/helm/airflow
        run: |
          sed -i 's|repository:.*|repository: ${{ secrets.DOCKER_USERNAME }}/hr-platform|' values.yml
          sed -i 's|tag:.*|tag: "${{ github.sha }}"|' values.yml

      - name: Commit and Push
        working-directory: infra
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Deploy image ${{ github.sha }}"
          git push origin main 